{% extends "base.html" %}
{% block title %}{{ title }} · Madden League Tracker{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ title }}</h1>
  <p>{{ description }}</p>
  <div class="field">
    <label for="generated-link">Link</label>
    <input id="generated-link" type="text" value="{{ link }}" readonly autocomplete="off" spellcheck="false">
    <div class="field__help">It works once and expires {{ expires_at }}.</div>
  </div>
  <p class="notice" role="status">This link won't be shown again. Copy it now.</p>
  <p><a href="{{ back_url }}">Done</a></p>
</section>
{% endblock %}
