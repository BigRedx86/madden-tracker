{% extends "base.html" %}
{% block title %}Change password · Madden League Tracker{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Change password</h1>
  <form method="post">
    {% csrf_token %}
    {% include "accounts/_fields.html" %}
    <button type="submit">Change password</button>
  </form>
  <p><a href="{% url 'accounts:account' %}">Back to your account</a></p>
</section>
{% endblock %}
