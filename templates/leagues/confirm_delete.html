{% extends "base.html" %}
{% block title %}{{ title }} · {{ league.name }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ title }}</h1>
  <p>{{ consequence }}</p>
  {% if alternative %}<p class="muted">{{ alternative }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <button type="submit">{{ button }}</button>
    <a href="{{ cancel_url }}">Cancel</a>
  </form>
</section>
{% endblock %}
