{% extends "base.html" %}
{% block title %}Delete {{ game }} · {{ league.name }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Delete {{ game }}?</h1>
  <p>This also deletes {{ line_count }} stat line{{ line_count|pluralize }} entered for it. It can't be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Delete game and stat lines</button>
    <a href="{% url 'leagues:season' league.pk game.season_id %}">Cancel</a>
  </form>
</section>
{% endblock %}
